name: JPMC Daily Job Sync & Match Alerts

on:
  schedule:
    # Runs daily at 03:00 UTC (08:30 IST)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max job requisitions to query from Oracle Cloud'
        required: false
        default: '25'
      min_score:
        description: 'Minimum match fit score threshold to trigger alert (0-100)'
        required: false
        default: '50'
      force_email:
        description: 'Force email dispatch even if no new jobs are discovered'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Dry run preview without modifying persistent database'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  jpmc-watcher:
    name: Sync JPMC Jobs & Dispatch Alert
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Autonomous JPMC Job Watcher
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.force_email }}" = "true" ]; then
            FLAGS="$FLAGS --force-email"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          
          python scripts/jpmc_job_watcher.py \
            --limit "${{ github.event.inputs.limit || '25' }}" \
            --min-score "${{ github.event.inputs.min_score || '50' }}" \
            --output-summary "$GITHUB_STEP_SUMMARY" \
            $FLAGS
        env:
          PYTHONPATH: backend
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.GMAIL_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || secrets.ALERT_RECIPIENT_EMAIL }}

      - name: Commit updated job index & database (if modified and not dry run)
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): automated JPMC job index update [skip ci]"
            git push
          else
            echo "No database changes to commit."
          fi
