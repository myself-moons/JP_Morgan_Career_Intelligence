<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23005ea6'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="FhvSqbd19KD5DJeQJH9FlG4YpGqhYssvQHlsFFtuSwo" />
    <meta name="theme-color" content="#020617" />
    <meta
      name="description"
      content="JCI Career Studio: mobile-first career preparation platform to upload your resume or projects, explore job skill demand, and build your personal learning roadmap."
    />
    <title>JCI Career Studio</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('jci_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
